<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fortressGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d6a4f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b4332;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e63946;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#c1121f;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4361ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7209b7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f9c74f" />
      <stop offset="100%" style="stop-color:#f3722c" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="900" fill="url(#bgGrad)" rx="24"/>

  <!-- Grid lines (subtle) -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="750" x2="800" y2="750"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
  </g>

  <!-- ===== TITLE AREA ===== -->
  <rect x="40" y="30" width="720" height="90" rx="16" fill="#ffffff" fill-opacity="0.07"/>
  <text x="400" y="72" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="bold" fill="#f9c74f" filter="url(#glow)">软件股要死了？</text>
  <text x="400" y="105" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#e0e0e0">AI 是「需要」它，还是能「绕过」它？</text>

  <!-- ===== AI ROBOT (center) ===== -->
  <!-- Body -->
  <rect x="335" y="165" width="130" height="100" rx="18" fill="url(#aiGrad)" filter="url(#shadow)"/>
  <!-- Head -->
  <rect x="348" y="130" width="104" height="80" rx="16" fill="url(#aiGrad)" filter="url(#shadow)"/>
  <!-- Eyes -->
  <circle cx="375" cy="160" r="12" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="425" cy="160" r="12" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="378" cy="162" r="6" fill="#4361ee"/>
  <circle cx="428" cy="162" r="6" fill="#4361ee"/>
  <circle cx="380" cy="160" r="3" fill="#ffffff"/>
  <circle cx="430" cy="160" r="3" fill="#ffffff"/>
  <!-- Mouth -->
  <path d="M 375 182 Q 400 194 425 182" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Antenna -->
  <line x1="400" y1="130" x2="400" y2="108" stroke="#4cc9f0" stroke-width="3" stroke-linecap="round"/>
  <circle cx="400" cy="103" r="7" fill="#4cc9f0" filter="url(#glow)"/>
  <!-- Arms -->
  <rect x="260" y="175" width="75" height="22" rx="11" fill="url(#aiGrad)"/>
  <rect x="465" y="175" width="75" height="22" rx="11" fill="url(#aiGrad)"/>
  <!-- Legs -->
  <rect x="355" y="265" width="30" height="40" rx="10" fill="url(#aiGrad)"/>
  <rect x="415" y="265" width="30" height="40" rx="10" fill="url(#aiGrad)"/>
  <!-- Label -->
  <text x="400" y="330" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#4cc9f0">AI Agent</text>

  <!-- ===== LEFT: FORTRESS (Safe) ===== -->
  <!-- Castle base -->
  <rect x="50" y="190" width="180" height="130" rx="8" fill="url(#fortressGrad)" filter="url(#shadow)"/>
  <!-- Castle towers -->
  <rect x="45" y="165" width="45" height="70" rx="4" fill="#2d6a4f"/>
  <rect x="200" y="165" width="45" height="70" rx="4" fill="#2d6a4f"/>
  <!-- Tower battlements -->
  <rect x="45" y="155" width="12" height="18" rx="2" fill="#1b4332"/>
  <rect x="62" y="155" width="12" height="18" rx="2" fill="#1b4332"/>
  <rect x="79" y="155" width="11" height="18" rx="2" fill="#1b4332"/>
  <rect x="200" y="155" width="12" height="18" rx="2" fill="#1b4332"/>
  <rect x="217" y="155" width="12" height="18" rx="2" fill="#1b4332"/>
  <rect x="234" y="155" width="11" height="18" rx="2" fill="#1b4332"/>
  <!-- Main battlements -->
  <rect x="90" y="180" width="16" height="18" rx="2" fill="#1b4332"/>
  <rect x="115" y="180" width="16" height="18" rx="2" fill="#1b4332"/>
  <rect x="140" y="180" width="16" height="18" rx="2" fill="#1b4332"/>
  <rect x="165" y="180" width="16" height="18" rx="2" fill="#1b4332"/>
  <!-- Gate -->
  <path d="M 115 320 L 115 280 Q 140 262 165 280 L 165 320 Z" fill="#0d2818"/>
  <!-- Data icon inside fortress -->
  <rect x="110" y="225" width="60" height="10" rx="3" fill="#52b788" fill-opacity="0.8"/>
  <rect x="110" y="242" width="45" height="10" rx="3" fill="#52b788" fill-opacity="0.6"/>
  <rect x="110" y="259" width="55" height="10" rx="3" fill="#52b788" fill-opacity="0.4"/>
  <!-- Lock icon -->
  <rect x="127" y="273" width="26" height="22" rx="4" fill="#f9c74f"/>
  <path d="M 133 273 Q 133 262 140 262 Q 147 262 147 273" stroke="#f9c74f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <circle cx="140" cy="282" r="4" fill="#1b4332"/>

  <!-- Safe label -->
  <rect x="50" y="338" width="180" height="32" rx="10" fill="#52b788" fill-opacity="0.2"/>
  <text x="140" y="358" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" fill="#52b788">🏰 核心堡垒</text>
  <text x="140" y="390" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#a8d5b5">独家数据 · 合规壁垒</text>
  <text x="140" y="408" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#a8d5b5">AI越强，它越值钱</text>

  <!-- ===== RIGHT: GLASS SHELL (Dangerous) ===== -->
  <!-- Shell (transparent box) -->
  <rect x="570" y="190" width="180" height="130" rx="8" fill="none" stroke="#e63946" stroke-width="2.5" stroke-dasharray="10,5" fill-opacity="0" filter="url(#shadow)"/>
  <rect x="570" y="190" width="180" height="130" rx="8" fill="#e63946" fill-opacity="0.08"/>
  <!-- Broken cracks -->
  <path d="M 610 200 L 625 230 L 615 250" stroke="#e63946" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 700 210 L 685 240 L 695 260" stroke="#e63946" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- Generic UI mockup inside -->
  <rect x="590" y="215" width="140" height="12" rx="3" fill="#e63946" fill-opacity="0.3"/>
  <rect x="590" y="235" width="100" height="8" rx="3" fill="#e63946" fill-opacity="0.2"/>
  <rect x="590" y="252" width="120" height="8" rx="3" fill="#e63946" fill-opacity="0.2"/>
  <rect x="590" y="269" width="80" height="8" rx="3" fill="#e63946" fill-opacity="0.2"/>
  <!-- Warning symbol -->
  <path d="M 650 285 L 635 308 L 665 308 Z" fill="#f9c74f" fill-opacity="0.9"/>
  <text x="651" y="305" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a1a2e">!</text>

  <!-- Danger label -->
  <rect x="570" y="338" width="180" height="32" rx="10" fill="#e63946" fill-opacity="0.15"/>
  <text x="660" y="358" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" fill="#e63946">🚪 开放门户</text>
  <text x="660" y="390" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#ffb3ba">只是流程壳子</text>
  <text x="660" y="408" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#ffb3ba">AI直接绕过</text>

  <!-- ===== ARROWS ===== -->
  <!-- Left arrow: AI needs fortress (green, solid) -->
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#52b788"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e63946"/>
    </marker>
    <marker id="arrowRedReverse" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#e63946"/>
    </marker>
  </defs>
  <!-- Green arrow: AI → Fortress (needs) -->
  <path d="M 335 215 L 245 220" stroke="#52b788" stroke-width="3" fill="none" marker-end="url(#arrowGreen)" stroke-linecap="round"/>
  <rect x="255" y="196" width="60" height="22" rx="8" fill="#52b788" fill-opacity="0.2"/>
  <text x="285" y="210" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="bold" fill="#52b788">需要它 ✓</text>

  <!-- Red arrow: AI bypasses shell (dashed, goes around) -->
  <path d="M 465 215 Q 530 150 575 210" stroke="#e63946" stroke-width="3" fill="none" stroke-dasharray="8,4" marker-end="url(#arrowRed)" stroke-linecap="round"/>
  <rect x="486" y="148" width="60" height="22" rx="8" fill="#e63946" fill-opacity="0.2"/>
  <text x="516" y="162" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="bold" fill="#e63946">绕过它 ✗</text>

  <!-- ===== DIVIDER ===== -->
  <line x1="60" y1="435" x2="740" y2="435" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- ===== THREE-LAYER FRAMEWORK ===== -->
  <text x="400" y="466" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" fill="#f9c74f">三层判断法</text>

  <!-- Layer 1 -->
  <rect x="50" y="480" width="700" height="62" rx="12" fill="#4361ee" fill-opacity="0.12" stroke="#4361ee" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="90" cy="511" r="18" fill="#4361ee" fill-opacity="0.8"/>
  <text x="90" y="516" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">1</text>
  <text x="120" y="504" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" fill="#e0e0e0">AI 能绕过它吗？</text>
  <text x="120" y="524" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#aaaaaa">能绕过 → 危险  ·  必须依赖 → 安全</text>

  <!-- Layer 2 -->
  <rect x="50" y="553" width="700" height="62" rx="12" fill="#7209b7" fill-opacity="0.12" stroke="#7209b7" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="90" cy="584" r="18" fill="#7209b7" fill-opacity="0.8"/>
  <text x="90" y="589" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">2</text>
  <text x="120" y="577" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" fill="#e0e0e0">数据沉淀在哪里？</text>
  <text x="120" y="597" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#aaaaaa">在软件里 → 护城河深  ·  在AI里 → 软件变备份仓库</text>

  <!-- Layer 3 -->
  <rect x="50" y="626" width="700" height="62" rx="12" fill="#f72585" fill-opacity="0.12" stroke="#f72585" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="90" cy="657" r="18" fill="#f72585" fill-opacity="0.8"/>
  <text x="90" y="662" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">3</text>
  <text x="120" y="650" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" fill="#e0e0e0">核心任务容错率高吗？</text>
  <text x="120" y="670" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#aaaaaa">必须100%准确（薪资/支付）→ 安全  ·  够好就行 → 高危</text>

  <!-- ===== DIVIDER 2 ===== -->
  <line x1="60" y1="708" x2="740" y2="708" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- ===== CONCLUSION BANNER ===== -->
  <rect x="50" y="720" width="700" height="68" rx="16" fill="url(#goldGrad)" fill-opacity="0.15" stroke="#f9c74f" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="400" y="748" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" fill="#f9c74f">软件股不是整体死亡，而是「强制分叉」</text>
  <text x="400" y="772" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#e0c97a">平台级数据护城河 ↑   ·   纯UI点状工具 ↓</text>

  <!-- ===== BOTTOM HASHTAGS ===== -->
  <text x="400" y="826" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#666688">#股市  #股票  #大模型  #金融投资  #软件开发</text>

  <!-- ===== EXAMPLE COMPANIES (small chips) ===== -->
  <!-- Safe companies under fortress -->
  <rect x="52" y="418" width="80" height="20" rx="8" fill="#52b788" fill-opacity="0.2"/>
  <text x="92" y="431" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#52b788">Salesforce ✓</text>
  <rect x="138" y="418" width="80" height="20" rx="8" fill="#52b788" fill-opacity="0.2"/>
  <text x="178" y="431" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#52b788">Snowflake ✓</text>

  <!-- Dangerous companies under shell -->
  <rect x="570" y="418" width="72" height="20" rx="8" fill="#e63946" fill-opacity="0.2"/>
  <text x="606" y="431" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#e63946">Calendly ✗</text>
  <rect x="648" y="418" width="100" height="20" rx="8" fill="#e63946" fill-opacity="0.2"/>
  <text x="698" y="431" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#e63946">Grammarly ✗</text>
</svg>
