<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 383" width="900" height="383">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="fortressGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#40916c"/>
      <stop offset="100%" style="stop-color:#1b4332"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4361ee"/>
      <stop offset="100%" style="stop-color:#7209b7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f9c74f"/>
      <stop offset="100%" style="stop-color:#f3722c"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e63946"/>
      <stop offset="100%" style="stop-color:#9d0208"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#52b788"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e63946"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="383" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="0.8">
    <line x1="0" y1="96" x2="900" y2="96"/>
    <line x1="0" y1="192" x2="900" y2="192"/>
    <line x1="0" y1="288" x2="900" y2="288"/>
    <line x1="225" y1="0" x2="225" y2="383"/>
    <line x1="450" y1="0" x2="450" y2="383"/>
    <line x1="675" y1="0" x2="675" y2="383"/>
  </g>

  <!-- Decorative glow orbs -->
  <circle cx="140" cy="192" r="90" fill="#52b788" fill-opacity="0.05"/>
  <circle cx="760" cy="192" r="90" fill="#e63946" fill-opacity="0.05"/>
  <circle cx="450" cy="192" r="70" fill="#4361ee" fill-opacity="0.06"/>

  <!-- ============================================================ -->
  <!-- LEFT PANEL: FORTRESS (safe) -->
  <!-- ============================================================ -->

  <!-- Castle body -->
  <rect x="42" y="148" width="156" height="110" rx="7" fill="url(#fortressGrad)" filter="url(#shadow)"/>
  <!-- Left tower -->
  <rect x="36" y="126" width="42" height="65" rx="4" fill="#2d6a4f"/>
  <!-- Right tower -->
  <rect x="162" y="126" width="42" height="65" rx="4" fill="#2d6a4f"/>
  <!-- Left tower battlements -->
  <rect x="36" y="117" width="11" height="14" rx="2" fill="#1b4332"/>
  <rect x="51" y="117" width="11" height="14" rx="2" fill="#1b4332"/>
  <rect x="66" y="117" width="12" height="14" rx="2" fill="#1b4332"/>
  <!-- Right tower battlements -->
  <rect x="162" y="117" width="11" height="14" rx="2" fill="#1b4332"/>
  <rect x="177" y="117" width="11" height="14" rx="2" fill="#1b4332"/>
  <rect x="192" y="117" width="12" height="14" rx="2" fill="#1b4332"/>
  <!-- Main wall battlements -->
  <rect x="84" y="138" width="14" height="14" rx="2" fill="#1b4332"/>
  <rect x="105" y="138" width="14" height="14" rx="2" fill="#1b4332"/>
  <rect x="126" y="138" width="14" height="14" rx="2" fill="#1b4332"/>
  <rect x="147" y="138" width="14" height="14" rx="2" fill="#1b4332"/>
  <!-- Gate arch -->
  <path d="M 100 258 L 100 225 Q 120 210 140 225 L 140 258 Z" fill="#0d2818"/>
  <!-- Data bars inside -->
  <rect x="90" y="168" width="60" height="9" rx="3" fill="#52b788" fill-opacity="0.8"/>
  <rect x="90" y="183" width="44" height="9" rx="3" fill="#52b788" fill-opacity="0.55"/>
  <rect x="90" y="198" width="52" height="9" rx="3" fill="#52b788" fill-opacity="0.35"/>
  <!-- Lock icon -->
  <rect x="107" y="210" width="26" height="20" rx="4" fill="#f9c74f"/>
  <path d="M 113 210 Q 113 200 120 200 Q 127 200 127 210" stroke="#f9c74f" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="120" cy="219" r="3.5" fill="#1b4332"/>

  <!-- Label -->
  <text x="120" y="288" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="bold" fill="#52b788" filter="url(#glow)">🏰 核心堡垒</text>
  <text x="120" y="307" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#95d5b2">独家数据 · AI越强它越值钱</text>

  <!-- Example chips -->
  <rect x="46" y="320" width="74" height="20" rx="8" fill="#52b788" fill-opacity="0.18"/>
  <text x="83" y="333" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#52b788">Salesforce ✓</text>
  <rect x="126" y="320" width="74" height="20" rx="8" fill="#52b788" fill-opacity="0.18"/>
  <text x="163" y="333" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#52b788">Snowflake ✓</text>

  <!-- ============================================================ -->
  <!-- CENTER PANEL: AI ROBOT + QUESTION -->
  <!-- ============================================================ -->

  <!-- Question banner at top -->
  <rect x="290" y="18" width="320" height="52" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#f9c74f" stroke-opacity="0.3" stroke-width="1"/>
  <text x="450" y="42" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="bold" fill="#f9c74f" filter="url(#glow)">软件股要死了？</text>
  <text x="450" y="61" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#ccccdd">AI是「需要」它，还是能「绕过」它</text>

  <!-- AI Robot body -->
  <rect x="400" y="102" width="100" height="80" rx="14" fill="url(#aiGrad)" filter="url(#shadow)"/>
  <!-- Robot head -->
  <rect x="410" y="72" width="80" height="64" rx="13" fill="url(#aiGrad)" filter="url(#shadow)"/>
  <!-- Eyes -->
  <circle cx="432" cy="98" r="10" fill="#fff" fill-opacity="0.9"/>
  <circle cx="468" cy="98" r="10" fill="#fff" fill-opacity="0.9"/>
  <circle cx="434" cy="100" r="5" fill="#4361ee"/>
  <circle cx="470" cy="100" r="5" fill="#4361ee"/>
  <circle cx="435" cy="98" r="2.5" fill="#fff"/>
  <circle cx="471" cy="98" r="2.5" fill="#fff"/>
  <!-- Mouth -->
  <path d="M 432 118 Q 450 128 468 118" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Antenna -->
  <line x1="450" y1="72" x2="450" y2="55" stroke="#4cc9f0" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="450" cy="50" r="6" fill="#4cc9f0" filter="url(#glow)"/>
  <!-- Arms -->
  <rect x="348" y="112" width="52" height="18" rx="9" fill="url(#aiGrad)"/>
  <rect x="500" y="112" width="52" height="18" rx="9" fill="url(#aiGrad)"/>
  <!-- Legs -->
  <rect x="415" y="182" width="24" height="32" rx="8" fill="url(#aiGrad)"/>
  <rect x="461" y="182" width="24" height="32" rx="8" fill="url(#aiGrad)"/>

  <!-- AI label -->
  <text x="450" y="232" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="bold" fill="#4cc9f0">AI Agent</text>

  <!-- Three-layer mini pills at bottom -->
  <rect x="302" y="290" width="296" height="76" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  <text x="450" y="310" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="bold" fill="#f9c74f">三层判断法</text>
  <circle cx="322" cy="326" r="9" fill="#4361ee" fill-opacity="0.8"/>
  <text x="322" y="330" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fff">1</text>
  <text x="338" y="330" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#ccccdd">AI 能绕过它吗？</text>
  <circle cx="322" cy="344" r="9" fill="#7209b7" fill-opacity="0.8"/>
  <text x="322" y="348" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fff">2</text>
  <text x="338" y="348" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#ccccdd">数据沉淀在哪里？</text>
  <circle cx="322" cy="362" r="9" fill="#f72585" fill-opacity="0.8"/>
  <text x="322" y="366" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fff">3</text>
  <text x="338" y="366" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#ccccdd">任务容错率高吗？</text>

  <!-- ============================================================ -->
  <!-- ARROWS between robot and panels -->
  <!-- ============================================================ -->

  <!-- Green arrow: robot → fortress (NEEDS it) -->
  <path d="M 400 135 L 250 178" stroke="#52b788" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)" stroke-linecap="round"/>
  <rect x="293" y="142" width="56" height="20" rx="8" fill="#52b788" fill-opacity="0.2"/>
  <text x="321" y="155" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" font-weight="bold" fill="#52b788">需要它 ✓</text>

  <!-- Red dashed arrow: robot → bypasses shell -->
  <path d="M 500 135 Q 600 80 662 148" stroke="#e63946" stroke-width="2.5" fill="none" stroke-dasharray="7,4" marker-end="url(#arrowRed)" stroke-linecap="round"/>
  <rect x="556" y="85" width="56" height="20" rx="8" fill="#e63946" fill-opacity="0.2"/>
  <text x="584" y="98" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" font-weight="bold" fill="#e63946">绕过它 ✗</text>

  <!-- ============================================================ -->
  <!-- RIGHT PANEL: GLASS SHELL (dangerous) -->
  <!-- ============================================================ -->

  <!-- Dashed shell box -->
  <rect x="660" y="148" width="200" height="110" rx="8" fill="#e63946" fill-opacity="0.07" stroke="#e63946" stroke-width="2" stroke-dasharray="9,5"/>
  <!-- Crack lines -->
  <path d="M 695 158 L 710 185 L 700 205" stroke="#e63946" stroke-width="1.5" fill="none" opacity="0.45"/>
  <path d="M 820 162 L 806 190 L 816 208" stroke="#e63946" stroke-width="1.5" fill="none" opacity="0.45"/>
  <!-- Mock UI bars inside -->
  <rect x="678" y="172" width="164" height="10" rx="3" fill="#e63946" fill-opacity="0.25"/>
  <rect x="678" y="190" width="120" height="8" rx="3" fill="#e63946" fill-opacity="0.15"/>
  <rect x="678" y="206" width="140" height="8" rx="3" fill="#e63946" fill-opacity="0.15"/>
  <rect x="678" y="222" width="90" height="8" rx="3" fill="#e63946" fill-opacity="0.15"/>
  <!-- Warning triangle -->
  <path d="M 752 232 L 737 255 L 767 255 Z" fill="#f9c74f" fill-opacity="0.85"/>
  <text x="752" y="252" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a1a2e">!</text>

  <!-- Label -->
  <text x="760" y="288" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="bold" fill="#e63946" filter="url(#glow)">🚪 开放门户</text>
  <text x="760" y="307" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#ffb3ba">只是流程壳子 · 被加速淘汰</text>

  <!-- Example chips -->
  <rect x="664" y="320" width="72" height="20" rx="8" fill="#e63946" fill-opacity="0.18"/>
  <text x="700" y="333" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#e63946">Calendly ✗</text>
  <rect x="742" y="320" width="80" height="20" rx="8" fill="#e63946" fill-opacity="0.18"/>
  <text x="782" y="333" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#e63946">Grammarly ✗</text>

  <!-- ============================================================ -->
  <!-- BOTTOM CONCLUSION BAR -->
  <!-- ============================================================ -->
  <rect x="0" y="355" width="900" height="28" fill="url(#goldGrad)" fill-opacity="0.18"/>
  <line x1="0" y1="355" x2="900" y2="355" stroke="#f9c74f" stroke-opacity="0.3" stroke-width="1"/>
  <text x="450" y="373" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="bold" fill="#f9c74f">软件股不是整体死亡，而是「强制分叉」——独家数据护城河 ↑    纯UI点状工具 ↓</text>
</svg>
